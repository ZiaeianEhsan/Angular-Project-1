<form (ngSubmit)="onSubmit(inputTitle.value, textTitle.value)" #form>
  <app-control label="Title" >
    <input name="title" id="title" #inputTitle #input/>
  </app-control>
  <app-control  label="Requeset">
    <textarea name="request" id="request" #textTitle #input></textarea>
  </app-control>
  <button appButton>
    Submit
    <span ngProjectAs="icon"> ⌲ </span>
  </button>
</form>
